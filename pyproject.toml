[project]
name = "noisecheck"
version = "0.1.0"
description = "Tells you if your AI eval result is a real improvement or just noise"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "y4hyya" }]
keywords = ["evals", "llm", "statistics", "bootstrap", "testing", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/y4hyya/noisecheck"
Issues = "https://github.com/y4hyya/noisecheck/issues"

[project.scripts]
noisecheck = "noisecheck.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "scipy-stubs>=1.17.1.5",
    "certifi>=2026.7.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noisecheck"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "examples",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=noisecheck --cov-branch --cov-report=term-missing --cov-fail-under=90"
markers = ["slow: long running statistical checks"]
filterwarnings = ["error"]
